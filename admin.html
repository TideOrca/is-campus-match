<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>赛事报名后台 · 黑流树海</title><link rel="stylesheet" href="styles.css"><style>
body{min-height:100vh;background:#121615;color:#eef0ea}.admin{max-width:1200px;margin:auto;padding:48px 5vw}.admin-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #47504a;padding-bottom:25px;margin-bottom:26px}.admin h1{font-size:clamp(30px,5vw,62px);margin:8px 0;color:#fff}.admin .eyebrow{color:#a7e328}.admin-actions{display:flex;gap:10px;align-items:center}.admin-actions button,.login button{border:0;background:#a7e328;padding:12px 17px;font-weight:800;cursor:pointer}.admin-actions button.secondary{background:#2c332f;color:#fff}.table-wrap{overflow:auto;border:1px solid #47504a}.admin table{border-collapse:collapse;width:100%;min-width:750px}.admin th,.admin td{text-align:left;padding:15px 16px;border-bottom:1px solid #303733;font-size:13px}.admin th{font:11px "Roboto Mono";color:#9ba39d;background:#1a201d}.admin tr:hover td{background:#1a201d}.admin input[type=number]{width:100px;background:#202722;color:#fff;border:1px solid #526157;padding:9px}.admin .empty{text-align:center;padding:70px;color:#89918b}.login{max-width:450px;margin:18vh auto;padding:40px;background:#1a201d;border-top:6px solid #a7e328}.login h1{margin:8px 0 25px}.login label{display:block;font-size:12px;color:#aab2ac}.login input{display:block;width:100%;margin:8px 0 20px;padding:13px;background:#0f1311;border:1px solid #4a554c;color:#fff}.notice{margin:18px 0;color:#a7e328;font-size:13px}.error{color:#ff8d76}.hidden{display:none!important}@media(max-width:700px){.admin{padding:30px 18px}.admin-head{display:block}.admin-actions{margin-top:20px}}
</style></head><body><main class="admin"><section id="loginView" class="login"><p class="eyebrow"><span></span> 管理员入口</p><h1>报名数据终端</h1><label>访问密码<input id="adminPassword" type="password" autocomplete="current-password"></label><button id="loginButton">进入后台 →</button><p id="loginError" class="error"></p></section><section id="panelView" class="hidden"><header class="admin-head"><div><p class="eyebrow"><span></span> 黑流树海 · 校内赛事</p><h1>报名数据终端</h1><p id="countLabel">正在读取报名数据…</p></div><div class="admin-actions"><button id="refreshButton" class="secondary">刷新</button><button id="logoutButton" class="secondary">退出</button></div></header><p id="adminNotice" class="notice"></p><div class="table-wrap"><table><thead><tr><th>排名</th><th>姓名</th><th>分队</th><th>比赛日期</th><th>报名时间</th><th>得分（可修改）</th><th>保存</th></tr></thead><tbody id="playersBody"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
